name: synapse

networks:
  proxy:
    name: proxy
    external: true
  internal:
    internal: true

volumes:
  synapse-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/synapse/database
  synapse-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/synapse/data
  synapse-media:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/synapse/media
  synapse-coturn:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/synapse/coturn
  synapse-redis:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/synapse/redis

services:
  synapse-db:
    container_name: synapse-db
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    volumes:
      - synapse-database:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    environment:
      - POSTGRES_USER=synapse
      - POSTGRES_PASSWORD=${DB_USER_PASS}
      - POSTGRES_DB=synapse
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - internal
    deploy:
      resources:
        limits:
          memory: 768M
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "synapse"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Service name stays synapse-redis on purpose: the hostname is baked into
  # /data/homeserver.yaml, which lives outside this repo. Renaming the service
  # would break the running instance until that file is hand-edited.
  #
  # Synapse talks RESP through txredisapi + hiredis with no version gating, so
  # valkey is a clean swap. What this actually serves is the ExternalCache
  # (event_to_prev_state_group, get_joined_hosts, 1h TTL) plus the worker
  # replication pub/sub. With no workers the cache mainly buys a warmer
  # federation sender across restarts, which is why the volume is kept.
  synapse-redis:
    container_name: synapse-redis
    image: valkey/valkey:9-alpine
    security_opt:
      - no-new-privileges:true
    command: valkey-server --save 60 1 --loglevel warning
    volumes:
      - synapse-redis:/data
      - /etc/localtime:/etc/localtime:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  synapse-coturn:
    container_name: synapse-coturn
    image: coturn/coturn:edge-alpine
    security_opt:
      - no-new-privileges:true
    network_mode: host # Required for TURN server to work properly
    volumes:
      - synapse-coturn:/etc/coturn
      - /etc/localtime:/etc/localtime:ro
    command:
      [
        "-n",
        "--log-file=stdout",
        "--external-ip=${EXTERNAL_IP}",
        "--realm=${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}",
        "--listening-port=3478",
        "--min-port=49152",
        "--max-port=49252",
        "--use-auth-secret",
        "--static-auth-secret=${TURN_SECRET}",
        "--no-tcp",
        "--no-tls",
        "--no-dtls",
      ]
    restart: unless-stopped

  synapse-well-known:
    container_name: synapse-well-known
    image: nginx:1-alpine
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./well-known:/usr/share/nginx/html/.well-known
      - ./well-known/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.synapse-well-known-secure.entrypoints=websecure
      - traefik.http.routers.synapse-well-known-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`) && PathPrefix(`/.well-known`)
      - traefik.http.routers.synapse-well-known-secure.tls=true
      - traefik.http.routers.synapse-well-known-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.synapse-well-known-secure.service=synapse-well-known
      - traefik.http.routers.synapse-well-known-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.synapse-well-known.loadbalancer.server.port=80
    restart: unless-stopped

  synapse-livekit:
    container_name: synapse-livekit
    image: livekit/livekit-server:latest
    security_opt:
      - no-new-privileges:true
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "7881:7881/tcp"
      # Be sure to have these bypass Traefik as this range spawns ~1,000 docker-proxy processes.
      # See docs/docker-tuning.md
      - "51000-52000:51000-52000/udp"
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.synapse-livekit-secure.entrypoints=websecure
      - traefik.http.routers.synapse-livekit-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`) && PathPrefix(`/livekit/sfu`)
      - traefik.http.routers.synapse-livekit-secure.tls=true
      - traefik.http.routers.synapse-livekit-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.synapse-livekit-secure.service=synapse-livekit-svc
      - traefik.http.middlewares.synapse-livekit-strip.stripprefix.prefixes=/livekit/sfu
      - traefik.http.routers.synapse-livekit-secure.middlewares=https-redirect@file,secure-headers@file,synapse-livekit-strip
      - traefik.http.services.synapse-livekit-svc.loadbalancer.server.port=7880
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"
    restart: unless-stopped

  synapse-lk-jwt:
    container_name: synapse-lk-jwt
    image: ghcr.io/element-hq/lk-jwt-service:latest
    security_opt:
      - no-new-privileges:true
    environment:
      - LIVEKIT_URL=wss://${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}/livekit/sfu
      - LIVEKIT_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_SECRET=${LIVEKIT_API_SECRET}
      # Deliberately unset. The service defaults to binding :8080, and the
      # image healthcheck reads LIVEKIT_JWT_BIND as a bare PORT and builds
      # http://localhost:$BIND/healthz from it. Setting it to a host:port pair
      # yields http://localhost:0.0.0.0:8080/healthz, which never resolves, so
      # the container reports unhealthy while serving traffic perfectly well.
      # Upstream bug in v0.6.0 healthcheck/main.go, not a config error.
      - LIVEKIT_FULL_ACCESS_HOMESERVERS=${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      synapse-livekit:
        condition: service_started
    networks:
      - proxy
      - internal
    labels:
      - traefik.enable=true
      - traefik.http.routers.synapse-lk-jwt-secure.entrypoints=websecure
      - traefik.http.routers.synapse-lk-jwt-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`) && PathPrefix(`/livekit/jwt`)
      - traefik.http.routers.synapse-lk-jwt-secure.tls=true
      - traefik.http.routers.synapse-lk-jwt-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.synapse-lk-jwt-secure.service=synapse-lk-jwt-svc
      - traefik.http.middlewares.synapse-lk-jwt-strip.stripprefix.prefixes=/livekit/jwt
      - traefik.http.routers.synapse-lk-jwt-secure.middlewares=https-redirect@file,secure-headers@file,gzip-compress@file,synapse-lk-jwt-strip
      - traefik.http.services.synapse-lk-jwt-svc.loadbalancer.server.port=8080
    restart: unless-stopped

  synapse-app:
    container_name: synapse-app
    image: ghcr.io/element-hq/synapse:latest
    security_opt:
      - no-new-privileges:true
    volumes:
      - synapse-data:/data
      - synapse-media:/media_store
      - /etc/localtime:/etc/localtime:ro
    environment:
      - UID=${PUID}
      - GID=${PGID}
      - TZ=${TIMEZONE}
      # Used only by the one-off "generate" run that creates homeserver.yaml.
      # In normal "run" mode the image reads none of these: all real settings,
      # including the database credentials and the redis host, come from
      # /data/homeserver.yaml.
      - SYNAPSE_SERVER_NAME=${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}
      - SYNAPSE_REPORT_STATS=no
    depends_on:
      synapse-db:
        condition: service_healthy
      synapse-redis:
        condition: service_healthy
      synapse-coturn:
        condition: service_started
      synapse-well-known:
        condition: service_started
    networks:
      - proxy
      - internal
    # Loopback only, so the admin API stays reachable from a shell on the host
    # while Traefik refuses it from the internet:
    #   curl -H "Authorization: Bearer $TOKEN" \
    #     http://127.0.0.1:8008/_synapse/admin/v1/registration_tokens
    # Nothing outside the host can reach this; the container publishes no other
    # port. Equivalent without the binding: docker exec synapse-app curl ...
    ports:
      - "127.0.0.1:8008:8008"
    labels:
      - traefik.enable=true
      - traefik.http.routers.synapse-app-secure.entrypoints=websecure
      - traefik.http.routers.synapse-app-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`) && (PathPrefix(`/_matrix`) || PathPrefix(`/_synapse`)) && !PathPrefix(`/_synapse/admin`)
      - traefik.http.routers.synapse-app-secure.tls=true
      - traefik.http.routers.synapse-app-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.synapse-app-secure.service=synapse-app
      - traefik.http.routers.synapse-app-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.synapse-app.loadbalancer.server.port=8008

      # /_synapse/admin is excluded from the rule above, so it is not served to
      # the internet at all. Admin work runs from a shell on the host against
      # 127.0.0.1:8008, see docs/synapse.md.
      #
      # Uncomment to publish it again, which is what a browser-based admin UI
      # such as Ketesa (formerly synapse-admin) needs, since those are
      # client-side apps that call the admin API from your browser. No priority
      # is needed: this rule and the one above are mutually exclusive. Set a
      # source range you can actually reach, or drop the last two lines to
      # publish it openly and rely on the admin token alone.
      # - traefik.http.routers.synapse-admin-secure.entrypoints=websecure
      # - traefik.http.routers.synapse-admin-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`) && PathPrefix(`/_synapse/admin`)
      # - traefik.http.routers.synapse-admin-secure.tls=true
      # - traefik.http.routers.synapse-admin-secure.tls.certresolver=${CERT_RESOLVER}
      # - traefik.http.routers.synapse-admin-secure.service=synapse-app
      # - traefik.http.routers.synapse-admin-secure.middlewares=https-redirect@file,secure-headers@file,synapse-admin-allow
      # - traefik.http.middlewares.synapse-admin-allow.ipallowlist.sourcerange=10.0.0.0/8,192.168.0.0/16,100.64.0.0/10
    deploy:
      resources:
        limits:
          memory: 1.5G
    restart: unless-stopped

  # # Matrix Authentication Service. Entirely optional: legacy password login
  # # keeps working without it, and Element has not forced a migration.
  # #
  # # Enable it together with the matrix_authentication_service section in
  # # homeserver.yaml.
  # #
  # # MAS is configured by a YAML file, not by environment variables. The only
  # # env var it reads for configuration is MAS_CONFIG, naming the file(s) to
  # # load. Generate a starting point with:
  # #
  # #   docker run --rm ghcr.io/element-hq/matrix-authentication-service:latest \
  # #     config generate > mas-config.yaml
  # #
  # # then set the database DSN, the public base URL, and matrix.secret, which
  # # must equal the secret in homeserver.yaml. See docs/synapse.md.
  # synapse-mas:
  #   container_name: synapse-mas
  #   image: ghcr.io/element-hq/matrix-authentication-service:latest
  #   security_opt:
  #     - no-new-privileges:true
  #   environment:
  #     - MAS_CONFIG=/config/mas-config.yaml
  #   volumes:
  #     - ./mas-config.yaml:/config/mas-config.yaml:ro
  #     - /etc/localtime:/etc/localtime:ro
  #   depends_on:
  #     synapse-db:
  #       condition: service_healthy
  #   networks:
  #     - internal
  #     - proxy
  #   labels:
  #     - traefik.enable=true
  #     - traefik.http.routers.synapse-mas-secure.entrypoints=websecure
  #     - traefik.http.routers.synapse-mas-secure.rule=Host(`mas.${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`)
  #     - traefik.http.routers.synapse-mas-secure.tls=true
  #     - traefik.http.routers.synapse-mas-secure.tls.certresolver=${CERT_RESOLVER}
  #     - traefik.http.routers.synapse-mas-secure.service=synapse-mas
  #     - traefik.http.routers.synapse-mas-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
  #     # MAS listens on 8080 by default; match whatever http.listeners says in
  #     # mas-config.yaml.
  #     - traefik.http.services.synapse-mas.loadbalancer.server.port=8080
  #   restart: unless-stopped
