name: mautrix-whatsapp

networks:
  proxy:
    name: proxy
    external: true

volumes:
  mautrix-whatsapp-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/mautrix-whatsapp/data

services:
  mautrix-whatsapp:
    container_name: mautrix-whatsapp
    image: dock.mau.dev/mautrix/whatsapp:latest
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TIMEZONE}
    volumes:
      - mautrix-whatsapp-data:/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --tries=1 -O - http://localhost:29318/_matrix/mau/live || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - proxy
    init: true
    labels:
      - traefik.enable=true
      - traefik.http.routers.mautrix-whatsapp-app-secure.entrypoints=websecure
      - traefik.http.routers.mautrix-whatsapp-app-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`)
      - traefik.http.routers.mautrix-whatsapp-app-secure.tls=true
      - traefik.http.routers.mautrix-whatsapp-app-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.mautrix-whatsapp-app-secure.service=mautrix-whatsapp-app
      - traefik.http.routers.mautrix-whatsapp-app-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.mautrix-whatsapp-app.loadbalancer.server.port=29318
    restart: unless-stopped
