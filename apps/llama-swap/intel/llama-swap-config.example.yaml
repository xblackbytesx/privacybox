# llama-swap model definitions (mounted at /app/config.yaml).
#
# One model loaded at a time, previous unloaded on swap, which is what makes a
# 12GB card workable. `ttl` also unloads after N idle seconds. ${PORT} is
# auto-assigned per model.
#
# Sized for a 12GB Intel Arc B580, 64GB RAM, 6-core CPU, llama.cpp Vulkan
# backend (~2x SYCL on Arc). Adjust quants, -c and --n-cpu-moe for other setups.
#
# PICKING A MODEL: dense or MoE matters more than file size. --n-cpu-moe puts
# routed experts in RAM and keeps attention on the GPU, so only active params
# hit the CPU per token; that is what makes a ~17GB MoE usable on 12GB. A dense
# model of the same size has nothing to offload and costs full compute on every
# CPU-resident layer. Dense above ~14B wants a 24GB card.
#
# PATH TAXONOMY: /models/<source>/<owner>/<repo>/<file>.gguf. The path is the
# upstream identity, which keeps same-named files apart (every repo ships its
# own mmproj-F16.gguf) and matches what modelarr resolves for a llama-swap
# target, so its files.tsv destinations are these paths verbatim.
#
# The <source> segment is new: models come from more than HuggingFace now. An
# older tree is /models/<owner>/<repo>/ and needs a one-time re-shape (the dot
# name keeps the new directory out of the glob; safe to re-run):
#   cd $DOCKER_ROOT/llama-swap/models
#   [ -d huggingface ] || { mkdir .hf && mv */ .hf/ && mv .hf huggingface; }
#
# --jinja on every model: without it llama.cpp ignores the GGUF's own chat
# template and uses a legacy matcher with no concept of tools, leaving `tools`
# inert. Check with: docker logs llama-swap | grep -i "chat format"
# A named format is good; "Generic" means the template was not recognised.
#
# --load-mode none on every model: read the whole file into memory rather than
# memory-map it. It replaced --no-mmap, which llama.cpp removed in Sep 2026 along
# with --mmap/--mlock/--direct-io. The old flag on a new image makes llama-server
# exit on argument parsing, so every model fails at once, ~250ms in, with the
# opaque "upstream command exited prematurely". Older images need --no-mmap back.

# 10 min ceiling to become ready: `coder` reads ~36GiB (--load-mode none) before serving,
# ~1.6x what `smart` does. Raise again if a cold load ever trips the health check.
healthCheckTimeout: 600
logLevel: info

models:
  # Quick chat, and orchestration for tools firing many short calls under tight
  # timeouts (Odysseus Deep Research has some hardcoded at 60s).
  #
  # Qwen3-4B-Instruct-2507 is a DEDICATED NON-THINKING model: never emits
  # <think>, so it answers immediately instead of overthinking simple questions.
  # Preferred over hybrid Qwen3.5-4B, whose thinking-disable switches are buggy
  # in llama.cpp. Same Qwen3.x chat template and tool-calling format as `smart`.
  #
  # -fa on despite the usual Arc/Vulkan preference for off: fully on the GPU at
  # -c 32768, FA's small compute buffer is what keeps it fitting in 12GB. With
  # -fa off the ~4.4GB non-FA buffer causes memory pressure and TTFT collapses
  # to ~4.7s from ~0.25s. llama-bench prefers -fa off on prefill throughput, but
  # TTFT is the metric that matters for short swapping calls.
  "fast":
    name: "Qwen3-4B-Instruct (fast, no-think)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/unsloth/Qwen3-4B-Instruct-2507-GGUF/Qwen3-4B-Instruct-2507-Q8_0.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --jinja

  # Deep chat. 35B total / ~3B active MoE, experts in RAM via --n-cpu-moe. Slow
  # per token with slow prefill: good for quality chat, poor for many-call loops
  # (use `fast` there).
  "smart":
    name: "Qwen3.6-35B-A3B (smart)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/unsloth/Qwen3.6-35B-A3B-GGUF/Qwen3.6-35B-A3B-UD-Q4_K_XL.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      --n-cpu-moe 32
      -t 6
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --jinja

  # TRIAL, A/B against `smart`. Ornith 1.5 (DeepReinforce, MIT, Aug 2026) is the
  # same Qwen3.5-MoE architecture and size as `smart` (40 layers, 256 experts, 8
  # routed + 1 shared, ~3B active), RL-tuned for agentic coding. Its self-reported
  # table beats Qwen3.6-35B-A3B (SWE-bench Verified 79 vs 73.4, Terminal-Bench 2.1
  # 67.8 vs 52.5, GPQA-D 89.2 vs 86), but nobody outside the lab has reproduced it
  # and it publishes no general chat or knowledge scores. If it wins, move this
  # cmd under `smart` and delete the entry, so clients never change model name.
  #
  # Official Q4_K_M (21.7GB); the repo ships standard K-quants only. Text-only
  # like `smart`, so its 903MB mmproj is skipped. --n-cpu-moe 32 is `smart`'s
  # tuned value and should carry over, but Q4_K_M keeps some ffn_down at Q6_K, so
  # per-layer expert size differs from UD-Q4_K_XL. If it dies with "upstream
  # command exited prematurely", raise it to 33 or 34.
  #
  # --temp 0.6 --top-p 0.95 --top-k 20 are the author's general-task defaults,
  # set server-side because sampling matters here: one independent 12GB-card
  # test saw the stock model refuse at a 0.8 temperature. Clients can override.
  #
  # No MTP: the release ships an untrained MTP head (~13% draft acceptance,
  # ornith-ai discussion #10). Those tensors are in the GGUF but only read with
  # --spec-type draft-mtp, so normal generation is unaffected.
  "ornith":
    name: "Ornith-1.5-35B-A3B (smart trial)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/ornith-ai/Ornith-1.5-35B-A3B-GGUF/Ornith-1.5-35B-Q4_K_M.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      --n-cpu-moe 32
      -t 6
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --jinja

  # DavidAU abliterated + NEO-CODE code-imatrix build of GLM-4.7-Flash. 30B-A3B
  # MoE (47 layers, deepseek2), coding/agentic. Runs like `smart`: experts in
  # RAM, attention on GPU. Slightly snappier on fewer total params.
  #
  # IQ4_NL (17.3GB): every quant in that repo carries a 16-bit output tensor, so
  # 4-bit holds up for code. Q5_K_M (21.6GB) for more fidelity; Q6_K (25GB) only
  # after raising the container memory cap in docker-compose-swap.yml to 32G.
  #
  # -fa off on the author's advice (speed issues); experts are in RAM so it is
  # not GPU-memory-bound anyway. --repeat-penalty 1.0 and --min-p 0.01 are
  # required: it loops with llama.cpp's 0.05 min-p default or a non-neutral
  # rep-pen. Author defaults temp 1.0 / top-p 0.95; ~0.7 for deterministic code.
  #
  # REQUIRES llama.cpp newer than commit 7789 (Jan 21 2026); earlier builds
  # mis-set scoring_func and produce looping garbage. Check /app/llama --version
  # after any image pull.
  #
  # --n-cpu-moe 47 = all experts on CPU: safe, and under-uses the 12GB. Tune DOWN
  # (44, 40, 36) while watching VRAM; expect to land near smart's 32. Restart
  # between changes.
  "uncensored":
    name: "GLM-4.7-Flash Uncensored (NEO-CODE)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/DavidAU/GLM-4.7-Flash-Uncensored-Heretic-NEO-CODE-Imatrix-MAX-GGUF/GLM-4.7-Flash-Uncen-Hrt-NEO-CODE-MAX-imat-D_AU-IQ4_NL.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      --n-cpu-moe 47
      -t 6
      -c 32768
      -b 2048
      --load-mode none
      -fa off
      --min-p 0.01
      --repeat-penalty 1.0
      --jinja

  # Qwen3-Coder-Next: 80B-A3B MoE, hybrid Gated DeltaNet + attention, text only.
  # Non-reasoning by design (never emits <think>), built for fast agentic code.
  # Feb 2026, on the Qwen3-Next-80B-A3B base, so it is a settled arch with months
  # of llama.cpp fixes behind it, not a fresh drop.
  #
  # Same ~3B active as `smart`, so per-token RAM traffic and throughput land in
  # the same class: the extra 45B of experts is a memory cost, not a speed cost.
  # This is the --n-cpu-moe idiom at its most favourable, 3B of 80B being far
  # sparser than 3B of 35B.
  #
  # UD-IQ4_XS (35.8GiB on disk, ~25GiB CPU-side once attention and KV are on the
  # B580). Quantization hurts code more than chat and IQ4 is where that stops
  # being a compromise, so it is worth the 36G cap in docker-compose-swap.yml.
  # UD-IQ3_XXS (26.5GiB) fits the old 28G cap if you want the compose change back.
  # UD-Q4_K_XL (46.2GiB) needs 40G+ and starts competing with ZFS ARC: don't.
  #
  # --min-p 0.01 (llama.cpp defaults to 0.05) and --repeat-penalty 1.0 per Unsloth,
  # same deviation `uncensored` carries. Author defaults temp 1.0 / top-p 0.95 /
  # top-k 40, left to the client like the other models.
  #
  # --n-cpu-moe IS THE WHOLE BALLGAME here, far more than it is on `smart`. 48
  # layers, 512 tiny routed experts (moe_intermediate_size 512) plus 1 shared, 10
  # active per token, so every token gathers 10 scattered slices per layer out of
  # ~34GiB of expert weight. Clamped at 99 (all experts in RAM) replies took ~47s
  # and clients timed out; at 37 it is fast. Fine-grained MoE punishes the safe
  # all-experts-on-CPU starting value far harder than coarse MoE does, so never
  # leave this one clamped.
  #
  # 37 = 48 layers at ~0.71GiB of experts each, ~8GiB free on the B580 once
  # non-expert weights and KV are placed, so ~11 layers of experts ride the GPU.
  # 37 IS THE EXACT FLOOR, measured: 36 and anything below fails to load at all,
  # llama-server aborting ~0.5s in on a failed Vulkan device allocation. Do NOT
  # copy `smart`'s tuned 32 to this model, its per-layer expert weight is roughly
  # half. There is nothing left to find below 37; don't go hunting again.
  #
  # Corollary: this sits ON the VRAM ceiling, so anything that grows the allocation
  # breaks the load outright instead of just slowing it, and always presents as the
  # same opaque "upstream command exited prematurely". Raising -c does it. So does
  # -fa off, whose compute buffer is several GB larger, which means benching FA
  # both ways here is not free: -fa off needs --n-cpu-moe raised to fit. So does a
  # new :vulkan image with different buffer sizing. Use 38 instead if you would
  # rather carry a one-layer margin than the last few percent of throughput.
  #
  # Context if this ever regresses: llama.cpp's CPU MoE path does not fully exploit
  # this model's sparsity (ggml-org/llama.cpp #19480), so RAM-resident experts cost
  # more here than the 3B active count predicts, which is why the clamp hurt so
  # much. Watch client timeouts too: Odysseus Deep Research gives up at 60s.
  #
  # Overlaps `uncensored` on coding. The split is reasoning: this one never thinks,
  # GLM-4.7-Flash does. Route quick completions here, hard problems there.
  "coder":
    name: "Qwen3-Coder-Next 80B-A3B (coder, no-think)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/unsloth/Qwen3-Coder-Next-GGUF/Qwen3-Coder-Next-UD-IQ4_XS.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      --n-cpu-moe 37
      -t 6
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --min-p 0.01
      --repeat-penalty 1.0
      --jinja

  # ── Gemma 4 vision pair (fast_mm / smart_mm) ──────────────────────────────────
  # Vision needs TWO files per model: weights plus that repo's own mmproj (vision
  # encoder + projector; the 12B is encoder-free, so its mmproj is just a small
  # projector). mmprojs are per-model with different embedding dims, so never mix
  # them. Every repo names its projector mmproj-F16.gguf; the taxonomy keeps them
  # apart. F16 not BF16: same size and quality, but F16 is the fast native path
  # on Vulkan and BF16 is spottier on Arc.
  #
  # Files (unsloth), both QAT: quantization-aware trained, so the single
  # UD-Q4_K_XL each repo ships holds near-bf16 quality:
  #   gemma-4-12B-it-qat-GGUF      -> gemma-4-12B-it-qat-UD-Q4_K_XL.gguf (6.7GB) + mmproj-F16.gguf (175MB)
  #   gemma-4-26B-A4B-it-qat-GGUF  -> gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf (14.2GB) + mmproj-F16.gguf (1.2GB)
  #
  # Images consume context tokens and add a one-off encode cost to TTFT, which is
  # why `fast` stays text-only. Needs a llama.cpp with Gemma 4 mmproj support.
  #
  # Thinking: the 12B's template defaults it OFF, right for a fast tier; send
  # chat_template_kwargs {"enable_thinking": true} per request for hard questions.
  # The 26B keeps it ON. enable_thinking:false disables reasoning outright rather
  # than relocating it, and is deprecated in favour of --reasoning off. Gemma 4
  # emits thought and tool call in one stream; llama-server's PEG parser (PR
  # #21326) separates them, so both work. Only disable if tool calls start
  # landing in reasoning_content.

  # 12B QAT: dense, fully on GPU, the everyday go-to. Replaced E4B (MMLU-Pro 77.2
  # vs 69.4, GPQA-D 78.8 vs 58.6, MMMU-Pro 69.1 vs 52.6 on Google's table). Dense
  # is fine here because nothing spills: 6.7GB of weights plus the 175MB mmproj
  # plus FA compute and KV at -c 32768 should land ~9-10GB. Expect ~35 t/s (Gemma
  # 3 12B's figure on a B580 under Vulkan): slower than E4B, faster than both MoE
  # tiers, whose experts run from RAM. -fa on for the same reason as `fast`.
  # Repo and file spell it 12B with a capital B, unlike the non-QAT repo.
  #
  # Long prompts: llama.cpp #26206 saw this 12B turn to mixed-script garbage past
  # ~5.8k prompt tokens on an Arc Pro B70 (Xe2, SYCL), sticky until reload; the
  # 26B passed. Unreproduced and closed unfixed. If it shows up here, revert to
  # E4B: unsloth/gemma-4-E4B-it-GGUF, gemma-4-E4B-it-Q5_K_M.gguf + its own mmproj.
  #
  # MTP left off: the repo ships mtp-gemma-4-12B-it.gguf (--model-draft ...
  # --spec-type draft-mtp --spec-draft-n-max 2, claimed 1.4-2.2x), but #24560
  # reported MTP making Gemma 4 output worse on a B580. Try it once the model has
  # proven itself.
  "fast_mm":
    name: "Gemma-4-12B QAT (fast, vision)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/unsloth/gemma-4-12B-it-qat-GGUF/gemma-4-12B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/huggingface/unsloth/gemma-4-12B-it-qat-GGUF/mmproj-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --jinja

  # 26B-A4B QAT: ~26B total / ~4B active MoE, runs like `smart`. The qat repo
  # ships essentially one quant on purpose: quantization-aware trained, so
  # UD-Q4_K_XL holds near-bf16 quality at 14.2GB.
  #
  # --n-cpu-moe 99 clamps to all experts on CPU (layer count unpublished; same
  # idiom as -ngl 99). Safe first boot; tune DOWN while watching VRAM as with
  # `uncensored`. If VRAM gets tight, --no-mmproj-offload keeps the projector on
  # CPU (slower one-off image encode, generation unaffected). -fa on to start,
  # but bench both ways: Gemma's sliding-window attention changes the math.
  "smart_mm":
    name: "Gemma-4-26B-A4B QAT (smart, vision)"
    ttl: 300
    cmd: >
      /app/llama-server
      -m /models/huggingface/unsloth/gemma-4-26B-A4B-it-qat-GGUF/gemma-4-26B-A4B-it-qat-UD-Q4_K_XL.gguf
      --mmproj /models/huggingface/unsloth/gemma-4-26B-A4B-it-qat-GGUF/mmproj-F16.gguf
      --host 127.0.0.1 --port ${PORT}
      -ngl 99
      --n-cpu-moe 99
      -t 6
      -c 32768
      -b 2048
      --load-mode none
      -fa on
      --jinja
