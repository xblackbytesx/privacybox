name: litellm

networks:
  proxy:
    name: proxy
    external: true
  internal:
    internal: true

volumes:
  litellm-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/litellm/database
  litellm-prometheus-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/litellm/prometheus-data
  litellm-valkey:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/litellm/valkey

services:
  litellm-db:
    container_name: litellm-db
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${DB_USER_PASS}
    volumes:
      - litellm-database:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=false
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d litellm -U litellm"]
      interval: 1s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  
  litellm-prometheus:
    image: prom/prometheus
    security_opt:
      - no-new-privileges:true
    volumes:
      - litellm-prometheus-data:/prometheus
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=false
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    networks:
      - internal
    restart: unless-stopped

  # Valkey is a drop-in for the Redis the proxy asks for. LiteLLM talks RESP
  # through redis-py and uses only core commands here, so no Redis modules are
  # involved. The one thing that would need them is semantic caching, which
  # wants the valkey-search module and a different image.
  #
  # maxmemory is set because a response cache is otherwise unbounded and valkey
  # ships with no limit. Everything litellm writes carries a TTL, so allkeys-lru
  # only ever drops entries that were going to expire anyway. The volume is kept
  # so the cache survives an --update restart, which is the point of caching a
  # metered API in the first place.
  litellm-valkey:
    container_name: litellm-valkey
    image: valkey/valkey:9-alpine
    security_opt:
      - no-new-privileges:true
    command: valkey-server --save 60 1 --loglevel warning --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - litellm-valkey:/data
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=false
    networks:
      - internal
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  litellm-app:
    container_name: litellm-app
    # Tracking upstream deliberately. There is no floating major or minor tag
    # to sit on (no :1, no :1.99), so the only choice is :latest or an exact
    # vX.Y.Z. MINOR is the weekly scheduled stable and PATCH is a hotfix, so
    # this pulls a new feature release every week, not just fixes.
    #
    # main-stable is what this used to track. It is legacy and was slated to
    # stop being published on 2026-09-01, so :latest replaces it. If a release
    # ever breaks something, pin the vX.Y.Z that was working. See docs/litellm.md.
    image: ghcr.io/berriai/litellm:latest
    security_opt:
      - no-new-privileges:true
    # config.yaml carries the cache and router blocks only. Models still come
    # from Postgres because STORE_MODEL_IN_DB is on, and the proxy merges the
    # two: the file is read first, then database rows overlay litellm_settings,
    # router_settings and general_settings. Editing cache settings in the admin
    # UI therefore wins over this file until those rows are deleted.
    #
    # The image CMD is ["--port", "4000"], and setting command replaces it, so
    # the port has to be repeated here.
    command: ["--port", "4000", "--config", "/app/config.yaml"]
    environment:
        DATABASE_URL: "postgresql://litellm:${DB_USER_PASS}@litellm-db:5432/litellm"
        STORE_MODEL_IN_DB: "True"
        # Single source of truth for the Valkey address. config.yaml reads both
        # of these back through os.environ/, in two separate blocks.
        REDIS_HOST: litellm-valkey
        REDIS_PORT: "6379"
    env_file:
      - .env
    depends_on:
      litellm-db:
        condition: service_healthy
      litellm-valkey:
        condition: service_healthy
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.litellm-app-secure.entrypoints=websecure
      - traefik.http.routers.litellm-app-secure.rule=Host(`${SUBDOMAIN:+${SUBDOMAIN}.}${DOMAIN}`)
      - traefik.http.routers.litellm-app-secure.tls=true
      - traefik.http.routers.litellm-app-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.litellm-app-secure.service=litellm-app
      - traefik.http.routers.litellm-app-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.litellm-app.loadbalancer.server.port=4000
    networks:
      - internal
      - proxy
    restart: unless-stopped
