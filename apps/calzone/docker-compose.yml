name: calzone

networks:
  proxy:
    name: proxy
    external: true
  internal:
    internal: true

volumes:
  calzone-database:
    driver: local
    driver_opts:
      type: none
      o: bindcalzone
      device: ${DOCKER_ROOT}/calzone/database

services:
  calzone-db:
    container_name: calzone-db
    image: postgres:17-alpine
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
      - FOWNER
      - SETGID
      - SETUID
    networks:
      - internal
    environment:
      POSTGRES_USER: calzone
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: calzone
    volumes:
      - calzone-database:/var/lib/postgresql/data
      - /etc/localtime:/etc/localtime:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calzone"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  calzone-app:
    container_name: calzone-app
    image: ghcr.io/xblackbytesx/calzone:${CALZONE_VERSION:-latest}
    security_opt:
      - no-new-privileges:true
    read_only: true
    cap_drop:
      - ALL
    networks:
      - internal
      - proxy
    environment:
      DATABASE_URL: postgres://calzone:${DB_PASSWORD}@calzone-db:5432/calzone
      CALZONE_PUBLIC_URL: ${CALZONE_PUBLIC_URL:-https://${SUBDOMAIN}.${DOMAIN}}
      CALZONE_DAV: ${CALZONE_DAV:-on}
      CALZONE_SECRET_KEY: ${CALZONE_SECRET_KEY:?set CALZONE_SECRET_KEY in .env}
      CALZONE_TWO_FACTOR: ${CALZONE_TWO_FACTOR:-everyone}
      CALZONE_COOKIE_SECURE: "on"
      CALZONE_BEHIND_PROXY: "on"
      CALZONE_BIND: 0.0.0.0:8080
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - /etc/localtime:/etc/localtime:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.calzone-app-secure.entrypoints=websecure
      - traefik.http.routers.calzone-app-secure.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.calzone-app-secure.tls=true
      - traefik.http.routers.calzone-app-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.calzone-app-secure.service=calzone-app
      - traefik.http.routers.calzone-app-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.calzone-app.loadbalancer.server.port=8080
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      calzone-db:
        condition: service_healthy
    restart: unless-stopped
