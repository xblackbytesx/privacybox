name: cleanuparr

networks:
  proxy:
    name: proxy
    external: true

volumes:
  cleanuparr-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/cleanuparr/config

services:
  cleanuparr:
    container_name: cleanuparr
    image: ghcr.io/cleanuparr/cleanuparr:latest
    security_opt:
      - no-new-privileges:true
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - UMASK=022
      - TZ=${TIMEZONE}
    volumes:
      - cleanuparr-config:/config
      - /etc/localtime:/etc/localtime:ro
    networks:
      - proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11011/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.cleanuparr-secure.entrypoints=websecure
      - traefik.http.routers.cleanuparr-secure.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      - traefik.http.routers.cleanuparr-secure.tls=true
      - traefik.http.routers.cleanuparr-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.cleanuparr-secure.service=cleanuparr
      - traefik.http.routers.cleanuparr-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.cleanuparr.loadbalancer.server.port=11011
    restart: unless-stopped
