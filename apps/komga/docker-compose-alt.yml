name: komga

volumes:
  komga-config:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/komga/config
  komga-manga-dir:
    driver: local
    driver_opts:
      type: ${MEDIA_DRIVER_OPT_TYPE}
      o: ${MEDIA_DRIVER_OPT_O}
      device: ${MANGA_PATH}
  # komga-comics-dir:
  #   driver: local
  #   driver_opts:
  #     type: ${MEDIA_DRIVER_OPT_TYPE}
  #     o: ${MEDIA_DRIVER_OPT_O}
  #     device: ${COMICS_PATH}

services:
  komga:
    container_name: komga
    image: gotson/komga:latest
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    environment:
      - TZ=${TIMEZONE}
      # # Raise the JVM heap if scans of a large library run out of memory
      # - JAVA_TOOL_OPTIONS=-Xmx4g
    volumes:
      - komga-config:/config
      - komga-manga-dir:/data/manga
      # - komga-comics-dir:/data/comics
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 25600:25600
    restart: unless-stopped

  # One-shot library renamer. Never starts with the stack: the profile keeps it
  # out of `docker compose up -d`, which is what manage.sh runs.
  #
  #   docker compose -f apps/komga/docker-compose.yml run --rm tidy
  #   docker compose -f apps/komga/docker-compose.yml run --rm tidy --apply
  #
  # A separate service rather than `exec` into komga, because the app image's
  # toolchain is not a contract: it has whatever the upstream base happens to
  # ship, and that can change on any version bump. This pins its own.
  tidy:
    profiles: ["tools"]
    image: python:3.13-alpine
    user: "${PUID}:${PGID}"
    security_opt:
      - no-new-privileges:true
    volumes:
      - komga-manga-dir:/data/manga
      - ./tidy:/tidy:ro
    working_dir: /data/manga
    entrypoint: ["python3", "/tidy/komga-tidy.py"]
    command: ["/data/manga"]
