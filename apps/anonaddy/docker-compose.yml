name: anonaddy

networks:
  proxy:
    name: proxy
    external: true
  internal:
    internal: true

volumes:
  anonaddy-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/anonaddy/data
  anonaddy-database:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DOCKER_ROOT}/anonaddy/database/
  # Uncomment together with the anonaddy-valkey service below.
  # anonaddy-valkey:
  #   driver: local
  #   driver_opts:
  #     type: none
  #     o: bind
  #     device: ${DOCKER_ROOT}/anonaddy/valkey

services:
  anonaddy-db:
    container_name: anonaddy-db
    image: mariadb:10
    security_opt:
      - no-new-privileges:true
    networks:
      - internal
    command:
      - "mysqld"
      - "--character-set-server=utf8mb4"
      - "--collation-server=utf8mb4_unicode_ci"
    environment:
      - MARIADB_RANDOM_ROOT_PASSWORD=yes
      - MYSQL_DATABASE=anonaddy
      - MYSQL_USER=anonaddy
      - MYSQL_PASSWORD=${DB_USER_PASS}
    volumes:
      - anonaddy-database:/var/lib/mysql
      - /etc/localtime:/etc/localtime:ro
    labels:
      - "traefik.enable=false"
    restart: unless-stopped

  # Optional: Redis-compatible store for rspamd. Only worth running if you
  # also set RSPAMD_ENABLE=true in anonaddy.env, because nothing else ever
  # connects to it. The Laravel app hardcodes CACHE_DRIVER=file,
  # QUEUE_CONNECTION=sync and SESSION_DRIVER=file, so REDIS_HOST is read by
  # rspamd and by nothing else.
  #
  # Enabling rspamd is what makes replying from an alias work, plus
  # quarantine, DKIM and ARC signing, bayes and greylisting. It also needs
  # DKIM keys and DNS records. Read docs/anonaddy.md first.
  # anonaddy-valkey:
  #   container_name: anonaddy-valkey
  #   image: valkey/valkey:9-alpine
  #   security_opt:
  #     - no-new-privileges:true
  #   command: valkey-server --save 60 1 --loglevel warning
  #   networks:
  #     - internal
  #   volumes:
  #     - anonaddy-valkey:/data
  #     - /etc/localtime:/etc/localtime:ro
  #   healthcheck:
  #     test: ["CMD", "valkey-cli", "ping"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 5
  #   labels:
  #     - "traefik.enable=false"
  #   restart: unless-stopped

  anonaddy-app:
    container_name: anonaddy-app
    image: anonaddy/anonaddy:latest
    security_opt:
      - no-new-privileges:true
    env_file:
      - "./anonaddy.env"
    environment:
      - DB_HOST=anonaddy-db
      - DB_DATABASE=anonaddy
      - DB_USERNAME=anonaddy
      - DB_PASSWORD=${DB_USER_PASS}
      # Uncomment with the anonaddy-valkey service above.
      # - REDIS_HOST=anonaddy-valkey
    volumes:
      - anonaddy-data:/data
    labels:
      - traefik.enable=true
      - traefik.http.routers.anonaddy-app-secure.entrypoints=websecure
      - traefik.http.routers.anonaddy-app-secure.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.anonaddy-app-secure.tls=true
      - traefik.http.routers.anonaddy-app-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.anonaddy-app-secure.service=anonaddy-app
      - traefik.http.routers.anonaddy-app-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file
      - traefik.http.services.anonaddy-app.loadbalancer.server.port=8000
    depends_on:
      anonaddy-db:
        condition: service_started
      # anonaddy-valkey:
      #   condition: service_healthy
    networks: 
      - internal
      - proxy
    ports:
      - target: 25
        published: 25
        protocol: tcp
    restart: unless-stopped
