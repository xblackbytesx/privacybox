log:
  level: INFO

global:
  checkNewVersion: true
  sendAnonymousUsage: false

api:
  insecure: true
  dashboard: true
  debug: true

entryPoints:
  web:
    address: ":80"
  websecure:
    address: ":443"

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: proxy
  file:
    filename: /config.yaml

# `resolvers` sets the recursive nameservers lego uses for the DNS-01
# propagation check. Without it lego falls back to the container's
# /etc/resolv.conf, which is Docker's embedded stub at 127.0.0.11 forwarding
# to whatever the host uses. That path caches, and the cache outlives the
# challenge window, so the check keeps seeing the previous run's TXT value or
# a negative answer and every domain times out. Public resolvers avoid it.
certificatesResolvers:
  # le-http:
  #   acme:
  #     email: john.doe@privacy.box
  #     storage: acme.json
  #     httpChallenge:
  #       entryPoint: http
  transip-dns:
    acme:
      email: john.doe@privacy.box
      storage: acme.json
      dnsChallenge:
        provider: transip
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        propagation:
          # Never check before the provider has published the record. A miss
          # negative-caches _acme-challenge for the zone's SOA minimum (1800s
          # on Cloudflare), which outlives the challenge window and turns one
          # early lookup into a guaranteed failure.
          delayBeforeChecks: 10s
          # Set disableANSChecks to true if the direct queries to the zone's
          # authoritative nameservers are blocked or intercepted outbound.
          # Checks then run against the resolvers listed above only.
          disableANSChecks: false
  cloudflare-dns:
    acme:
      email: john.doe@privacy.box
      storage: acme.json
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "1.0.0.1:53"
        propagation:
          delayBeforeChecks: 10s
          disableANSChecks: false
