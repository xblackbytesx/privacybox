name: traefik

networks:
  proxy:
    name: proxy
    external: true
  # Per-app ingress networks for containers that are deliberately kept off the
  # shared `proxy` network. Traefik has to join each one to reach the backend.
  paperclip-edge:
    name: paperclip-edge
    external: true

services:
  traefik:
    container_name: "traefik"
    image: "traefik:v3.7"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - paperclip-edge
    ports:
      - "80:80"
      - "443:443"
    # DNS Challenge only
    environment:
      - TRANSIP_ACCOUNT_NAME=${TRANSIP_ACCOUNT_NAME}
      - TRANSIP_PRIVATE_KEY_PATH=/transip.key
      - CLOUDFLARE_DNS_API_TOKEN=${CLOUDFLARE_API_TOKEN}
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./data/traefik.yaml:/etc/traefik/traefik.yaml:ro
      - ./data/acme.json:/acme.json
      - ./data/config.yaml:/config.yaml:ro
      - ./data/transip.key:/transip.key:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik-secure.entrypoints=websecure
      - traefik.http.routers.traefik-secure.rule=Host(`${SUBDOMAIN}.${DOMAIN}`)
      # basic-auth is appended only while TRAEFIK_BASIC_AUTH is non-empty. The
      # dashboard has no login of its own, so this is its only gate.
      - traefik.http.routers.traefik-secure.middlewares=https-redirect@file,non-www@file,secure-headers@file,gzip-compress@file${TRAEFIK_BASIC_AUTH:+,basic-auth@file}
      - traefik.http.routers.traefik-secure.tls=true
      - traefik.http.routers.traefik-secure.tls.certresolver=${CERT_RESOLVER}
      - traefik.http.routers.traefik-secure.service=api@internal
